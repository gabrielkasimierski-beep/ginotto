<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ginotto — Prueba: la burga real en video con humo</title>
<meta name="theme-color" content="#0c0907">
<link rel="icon" href="../../assets/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  :root { --vio:#4B2E83; --ora:#F2791E; --ink:#1d1428; }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0c0907; color: #fff; font: 500 17px/1.4 'Barlow', system-ui, sans-serif; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .poster { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s; }
  .poster.fuera { opacity: 0; pointer-events: none; }
  .barra { position: fixed; z-index: 8; inset: 0 0 auto 0; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 10px; }
  .marca { display: flex; align-items: center; gap: .5rem; font-family: 'Luckiest Guy', cursive; font-size: 1.35rem; letter-spacing: .02em; }
  .marca img { width: 44px; height: 44px; border-radius: 50%; }
  .btn { display: inline-block; font-family: 'Luckiest Guy', cursive; letter-spacing: .04em; padding: .6em 1.3em; border-radius: 14px; border: 3px solid var(--ink);
    background: var(--ora); color: #fff; text-shadow: 2px 2px 0 var(--ink); box-shadow: 4px 4px 0 var(--ink); font-size: 1.1rem; transition: transform .12s, box-shadow .12s; }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn-big { font-size: 1.5rem; padding: .55em 1.4em; }
  .texto { position: fixed; z-index: 5; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 76px); text-align: center; padding: 0 16px; pointer-events: none; }
  .kicker { font-family: 'Permanent Marker', cursive; color: #ffb066; font-size: 1.15rem; margin: 0 0 .3rem; }
  h1 { font-family: 'Luckiest Guy', cursive; font-weight: 400; margin: 0; line-height: .95; font-size: clamp(2.4rem, 10vw, 5rem); text-transform: uppercase; }
  h1 span { display: block; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ora); }
  h1 em { display: block; font-style: normal; color: var(--ora); text-shadow: 4px 4px 0 var(--ink); font-size: .8em; }
  .cta { position: fixed; z-index: 6; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); display: grid; justify-items: center; gap: .5rem; }
  .precio { margin: 0; padding: .3em .9em; border-radius: 12px; background: rgba(251,243,225,.96); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--vio); font-family: 'Permanent Marker', cursive; font-size: 1.15rem; }
  .precio b { color: #A84A06; font-weight: 400; }
  .nota { position: fixed; z-index: 6; left: 12px; bottom: 8px; font: 600 .78rem 'Barlow', sans-serif; opacity: .55; }
  @media (min-aspect-ratio: 1/1) {
    .texto, .cta { left: clamp(1.5rem, 6vw, 5rem); right: auto; width: min(40vw, 32rem); text-align: left; justify-items: start; top: 0; bottom: 0; display: grid; align-content: center; padding: 0; }
    .cta { align-content: end; padding-bottom: 13vh; }
    .texto h1 { font-size: clamp(3rem, 5.6vw, 5.6rem); }
  }
</style>
</head>
<body>
<img class="poster" id="poster" src="poster.jpg" alt="Gino Doble: doble carne, cheddar y bacon" width="720" height="964">
<canvas id="c" aria-hidden="true"></canvas>

<div class="barra">
  <a class="marca" href="../../index.html" aria-label="Ginotto Burger"><img src="../../assets/logo.webp" alt="" width="44" height="44">Ginotto</a>
  <a class="btn" href="../../index.html#carta">Pedir</a>
</div>
<div class="texto">
  <div><p class="kicker">Hamburguesería · Villa Urquiza</p>
  <h1><span>Las mejores</span> <em>que vas a probar</em></h1></div>
</div>
<div class="cta">
  <p class="precio"><b>Gino Doble</b> · $18.000</p>
  <a class="btn btn-big" href="../../index.html#carta">Pedir ahora</a>
</div>
<p class="nota">Prueba · video generado con IA + humo en tiempo real</p>

<script type="module">
  import * as THREE from "three";
  const canvas = document.getElementById("c"), poster = document.getElementById("poster");
  const quieta = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const celu = matchMedia("(max-width: 700px)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, celu ? 1.5 : 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10);

  // ---- ruido de valor (para el humo y para el calor) ----
  function texRuido(n = 256) {
    const lat = (f, seed) => { const g = new Float32Array(f * f); let s = seed; for (let i = 0; i < g.length; i++) { s = (s * 16807) % 2147483647; g[i] = s / 2147483647; } return g; };
    const octs = [[4, 1, 11], [8, 0.55, 23], [16, 0.3, 37], [32, 0.15, 51]].map(([f, a, s]) => ({ f, a, g: lat(f, s) }));
    const v = new Float32Array(n * n); let mn = 9, mx = -9;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let acc = 0;
      for (const o of octs) {
        const fx = x / n * o.f, fy = y / n * o.f, x0 = Math.floor(fx), y0 = Math.floor(fy);
        const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const x1 = (x0 + 1) % o.f, y1 = (y0 + 1) % o.f, xa = x0 % o.f, ya = y0 % o.f;
        const a = o.g[ya * o.f + xa], b = o.g[ya * o.f + x1], c = o.g[y1 * o.f + xa], d = o.g[y1 * o.f + x1];
        acc += o.a * (a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy);
      }
      v[y * n + x] = acc; if (acc < mn) mn = acc; if (acc > mx) mx = acc;
    }
    const data = new Uint8Array(n * n * 4);
    for (let i = 0; i < n * n; i++) { const u = Math.round((v[i] - mn) / (mx - mn) * 255); data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = u; data[i * 4 + 3] = 255; }
    const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
  }
  const ruido = texRuido();

  const FW = 720, FH = 964;
  // ---- el video: dos copias que se funden entre sí, así el bucle no tiene corte ----
  const crear = () => { const v = document.createElement("video"); v.src = "gino.mp4"; v.muted = true; v.playsInline = true; v.preload = "auto"; v.setAttribute("playsinline", ""); v.crossOrigin = "anonymous"; return v; };
  const vA = crear(), vB = crear();
  const texV = (v) => { const t = new THREE.VideoTexture(v); t.colorSpace = THREE.NoColorSpace; t.minFilter = t.magFilter = THREE.LinearFilter; t.generateMipmaps = false; return t; };
  const tA = texV(vA), tB = texV(vB);
  const matFoto = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uA: { value: tA }, uB: { value: tB }, uMix: { value: 0 }, uRuido: { value: ruido }, uTime: { value: 0 }, uBorde: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D uA, uB, uRuido; uniform float uMix, uTime, uBorde; varying vec2 vUv;
      void main(){
        vec2 uv = vUv;
        // calor: arriba del pan el aire ondula apenas
        float zona = smoothstep(0.56, 0.74, uv.y) * (1.0 - smoothstep(0.93, 1.0, uv.y));
        vec2 n = vec2(texture2D(uRuido, vec2(uv.x * 1.3, uv.y * 0.8 - uTime * 0.05)).r,
                      texture2D(uRuido, vec2(uv.x * 1.1 + 0.4, uv.y * 0.9 - uTime * 0.04 + 0.5)).r) - 0.5;
        uv += n * vec2(0.012, 0.007) * zona;
        vec3 c = mix(texture2D(uA, uv).rgb, texture2D(uB, uv).rgb, uMix);
        float lado = mix(1.0, smoothstep(0.0, 0.16, vUv.x) * smoothstep(1.0, 0.84, vUv.x), uBorde);
        gl_FragColor = vec4(c, lado);
      }`,
  });
  const plano = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), matFoto);
  scene.add(plano);

  // ---- humo ----
  const vsH = `
    uniform float uTime; uniform sampler2D uRuido; varying vec2 vUv;
    vec2 giro(vec2 p, float a){ float c = cos(a), s = sin(a); return vec2(c*p.x - s*p.y, s*p.x + c*p.y); }
    void main(){
      vUv = uv; vec3 p = position;
      float t = texture2D(uRuido, vec2(0.5, uv.y * 0.25 - uTime * 0.012)).r;
      p.x += (t - 0.5) * 0.42 * uv.y;
      float vx = texture2D(uRuido, vec2(0.2, uTime * 0.02)).r - 0.5;
      p.x += vx * pow(uv.y, 2.0) * 0.6;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`;
  const fsH = `
    uniform float uTime, uPico, uSemilla; uniform sampler2D uRuido; varying vec2 vUv;
    void main(){
      vec2 q = vec2(vUv.x * 0.7 + uSemilla, vUv.y * 0.42 - uTime * 0.055);
      float d = texture2D(uRuido, q * 1.7 + vec2(0.0, uTime * 0.03)).r - 0.5;
      vec2 st = q + vec2(d * 0.55, 0.0);
      float a = texture2D(uRuido, st).r, b = texture2D(uRuido, st * 2.6 + vec2(0.31, -uTime * 0.035)).r;
      float h = smoothstep(0.52, 0.9, a * 0.62 + b * 0.38);
      float lado = smoothstep(0.0, 0.34, vUv.x) * smoothstep(1.0, 0.66, vUv.x);
      float alto = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.25, vUv.y);
      gl_FragColor = vec4(vec3(1.0, 0.97, 0.93), h * lado * alto * uPico);
    }`;
  const hilos = [];
  const base = quieta ? [] : celu ? [[0.50, 0], [0.40, 1], [0.62, 2]] : [[0.50, 0], [0.38, 1], [0.62, 2], [0.45, 3], [0.57, 4]];
  base.forEach(([fx, i]) => {
    const mat = new THREE.ShaderMaterial({ vertexShader: vsH, fragmentShader: fsH, transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uRuido: { value: ruido }, uPico: { value: 0.42 }, uSemilla: { value: i * 0.37 } } });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 12, 36), mat); m.userData.fx = fx; scene.add(m); hilos.push(m);
  });

  // ---- encuadre: la foto vertical entra entera; en escritorio va a la derecha ----
  const apaisado = () => innerWidth / innerHeight >= 1;
  function ajustar() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    cam.left = 0; cam.right = w; cam.top = h; cam.bottom = 0; cam.updateProjectionMatrix();
    let pw, ph, cx;
    if (apaisado()) { ph = h; pw = ph * FW / FH; cx = Math.min(w - pw / 2 - w * 0.04, w * 0.74); matFoto.uniforms.uBorde.value = 1; }
    else { pw = w; ph = pw * FH / FW; if (ph < h) { ph = h; pw = ph * FW / FH; } cx = w / 2; matFoto.uniforms.uBorde.value = 0; }
    plano.scale.set(pw, ph, 1); plano.position.set(cx, h - ph / 2 - (apaisado() ? 0 : Math.max(0, (ph - h) * 0.1)), 0);
    // el humo nace en la tapa del pan (≈ 31 % de la foto, contando desde arriba)
    const topeY = plano.position.y + ph / 2 - ph * 0.31;
    hilos.forEach((m) => {
      const ancho = pw * 0.5, alto = ph * 0.62;
      m.scale.set(ancho, alto, 1);
      m.position.set(cx - pw / 2 + pw * m.userData.fx, topeY + alto / 2 - ph * 0.07, 1);
    });
  }
  addEventListener("resize", ajustar); ajustar();

  // ---- puntero: un par de píxeles de paralaje ----
  const p = { x: 0, y: 0, ax: 0, ay: 0 };
  addEventListener("pointermove", (e) => { p.x = e.clientX / innerWidth - 0.5; p.y = e.clientY / innerHeight - 0.5; }, { passive: true });

  let ult = performance.now(), visible = true;
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; ult = performance.now(); });
  function cuadro(ahora) {
    requestAnimationFrame(cuadro);
    if (!visible) return;
    const dt = Math.min(0.05, (ahora - ult) / 1000); ult = ahora;
    const t = ahora / 1000;
    p.ax += (p.x - p.ax) * Math.min(1, dt * 3); p.ay += (p.y - p.ay) * Math.min(1, dt * 3);
    matFoto.uniforms.uTime.value = quieta ? 0 : t;
    // respiración muy lenta + paralaje: la foto vive sin cambiar de forma
    const z = 1 + (quieta ? 0 : Math.sin(t * 0.35) * 0.006);
    plano.rotation.z = -p.ax * 0.006;
    plano.scale.x = plano.scale.x; // (el tamaño base lo fija ajustar)
    renderer.domElement.style.transform = `translate(${(-p.ax * 10).toFixed(2)}px, ${(-p.ay * 6).toFixed(2)}px) scale(${(1.02 * z).toFixed(4)})`;
    for (const m of hilos) m.material.uniforms.uTime.value = t;
    logicaVideo(ahora);
    renderer.render(scene, cam);
  }
  // reproducción en bucle con fundido de 0,8 s entre las dos copias
  let actual = vA, otra = vB, fundiendo = false, t0f = 0;
  const FUND = 0.8;
  vA.play().then(() => poster.classList.add("fuera")).catch(() => {});
  function logicaVideo(ahora) {
    const dur = actual.duration || 5;
    if (!fundiendo && actual.currentTime > dur - FUND - 0.05) { otra.currentTime = 0; otra.play().catch(() => {}); fundiendo = true; t0f = ahora; }
    if (fundiendo) {
      const k = Math.min(1, (ahora - t0f) / (FUND * 1000));
      matFoto.uniforms.uMix.value = actual === vA ? k : 1 - k;
      if (k >= 1) { actual.pause(); const tmp = actual; actual = otra; otra = tmp; fundiendo = false; }
    }
  }
  requestAnimationFrame(cuadro);
  window.__listo = true;
</script>
</body>
</html>
